<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_NAME}} — 技术指导文档</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg: #F2EEDF; --bg-secondary: #ECE6D2; --bg-tertiary: #E4DDD0;
      --text: #2A241B; --text-secondary: #5C5345; --text-muted: #7A7060; --text-faint: #9A9080;
      --border: #D8D0C0; --border-light: #E4DDD0;
      --accent: #B07070; --accent-hover: #9A5A5A; --accent-soft: #F5EDED; --accent-light: #F5EDED;
      --accent-green: #16a34a; --accent-green-light: #edf7f0;
      --accent-orange: #ca8a04; --accent-orange-light: #fefce8;
      --accent-red: #dc2626; --accent-red-light: #fef2f2;
      --accent-purple: #7c3aed; --accent-purple-light: #f5f3ff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --radius: 8px; --radius-lg: 12px;
      --font-sans: "Work Sans", "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Cormorant Garamond", "Noto Serif SC", serif;
      --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
      --toc-width: 240px; --header-height: 48px; --max-width: 960px;
      --code-bg: #ECE6D2; --code-border: #D8D0C0;
      --link: #8B5E5E; --link-hover: #6B4040;
      --info: #7B8FA0; --info-bg: #EDF0F2; --info-border: #C8D0D8;
      --success: #7B9A6B; --success-bg: #EDF2EE; --success-border: #C8D8CC;
      --warning: #B08B40; --warning-bg: #F5F0E0; --warning-border: #D8CCA0;
      --danger: #B05050; --danger-bg: #F5EDED; --danger-border: #D8B0B0;
      --note: #8B7B9A; --note-bg: #F0EDF5; --note-border: #C8C0D8;
      --card-green: #B7C7A8; --card-amber: #D6DD63; --card-red: #E1A4C2;
      --card-violet: #C9BEDC; --card-cyan: #A8C0B8; --card-blue: #9AB0C8;
    }
    /* 3-layer dark mode: data-theme > OS preference > default light */
    [data-theme="dark"] {
      --bg: #1E1B16; --bg-secondary: #282420; --bg-tertiary: #302B25;
      --text: #E8DDD0; --text-secondary: #B0A595; --text-muted: #8A7E70; --text-faint: #6A6055;
      --border: #4A4440; --border-light: #352F2A;
      --accent: #D4A0A0; --accent-hover: #E0B5B5; --accent-soft: #2A1E1E; --accent-light: #2A1E1E;
      --accent-green: #3fb950; --accent-green-light: #0d2818;
      --accent-orange: #d29922; --accent-orange-light: #2a1f05;
      --accent-red: #f85149; --accent-red-light: #2d0d0d;
      --accent-purple: #a371f7; --accent-purple-light: #1a0d2e;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
      --code-bg: #282420; --code-border: #4A4440;
      --link: #D4A0A0; --link-hover: #E0B5B5;
      --info: #58a6ff; --info-bg: #0d1d31; --info-border: #1f4170;
      --success: #3fb950; --success-bg: #0d2818; --success-border: #1a4731;
      --warning: #d29922; --warning-bg: #2a1f05; --warning-border: #4b3a12;
      --danger: #f85149; --danger-bg: #2d0d0d; --danger-border: #5a1a1a;
      --note: #a371f7; --note-bg: #1a0d2e; --note-border: #3b2066;
      --card-green: #3fb950; --card-amber: #d29922; --card-red: #f85149;
      --card-violet: #a371f7; --card-cyan: #39d2c0; --card-blue: #58a6ff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1E1B16; --bg-secondary: #282420; --bg-tertiary: #302B25;
        --text: #E8DDD0; --text-secondary: #B0A595; --text-muted: #8A7E70; --text-faint: #6A6055;
        --border: #4A4440; --border-light: #352F2A;
        --accent: #D4A0A0; --accent-hover: #E0B5B5; --accent-soft: #2A1E1E; --accent-light: #2A1E1E;
        --accent-green: #3fb950; --accent-green-light: #0d2818;
        --accent-orange: #d29922; --accent-orange-light: #2a1f05;
        --accent-red: #f85149; --accent-red-light: #2d0d0d;
        --accent-purple: #a371f7; --accent-purple-light: #1a0d2e;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4);
        --code-bg: #282420; --code-border: #4A4440;
        --link: #D4A0A0; --link-hover: #E0B5B5;
        --info: #58a6ff; --info-bg: #0d1d31; --info-border: #1f4170;
        --success: #3fb950; --success-bg: #0d2818; --success-border: #1a4731;
        --warning: #d29922; --warning-bg: #2a1f05; --warning-border: #4b3a12;
        --danger: #f85149; --danger-bg: #2d0d0d; --danger-border: #5a1a1a;
        --note: #a371f7; --note-bg: #1a0d2e; --note-border: #3b2066;
        --card-green: #3fb950; --card-amber: #d29922; --card-red: #f85149;
        --card-violet: #a371f7; --card-cyan: #39d2c0; --card-blue: #58a6ff;
      }
    }

    /* ===== Reset ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans); background: var(--bg); color: var(--text);
      line-height: 1.7; min-height: 100vh;
    }

    /* ===== Hero ===== */
    .hero {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      color: #fff; padding: 60px 24px 50px; text-align: center;
    }
    .hero h1 { font-family: var(--font-display); font-size: 2.4rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.02em; }
    .hero p { font-size: 1.1rem; opacity: 0.9; max-width: 650px; margin: 0 auto; }
    .hero .meta { margin-top: 18px; font-size: 0.85rem; opacity: 0.7; }

    /* ===== Topbar ===== */
    .topbar {
      position: sticky; top: 0; z-index: 100; background: var(--bg);
      border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
      height: var(--header-height); display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
    }
    .topbar-brand { font-weight: 700; font-size: 0.95rem; color: var(--text); white-space: nowrap; }
    .topbar-sep { color: var(--text-muted); font-size: 0.85rem; }
    .topbar-title { font-size: 0.85rem; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .topbar-actions { display: flex; gap: 6px; align-items: center; }
    .btn-icon {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text-secondary); cursor: pointer; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center; font-size: 0.9rem;
      transition: all 0.15s;
    }
    .btn-icon:hover { background: var(--bg-secondary); color: var(--text); }
    .sidebar-toggle { display: none; }

    /* ===== Layout ===== */
    .layout { display: grid; grid-template-columns: var(--toc-width) 1fr; min-height: calc(100vh - var(--header-height)); }

    /* ===== Sidebar ===== */
    .sidebar {
      position: sticky; top: var(--header-height); height: calc(100vh - var(--header-height));
      overflow-y: auto; padding: 16px 0; border-right: 1px solid var(--border);
      background: var(--bg-secondary); scrollbar-width: thin;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .toc-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 8px 20px 6px; }
    .toc-link {
      display: block; padding: 5px 20px; font-size: 0.82rem; color: var(--text-secondary);
      text-decoration: none; border-left: 2px solid transparent; transition: all 0.15s;
    }
    .toc-link:hover { color: var(--accent); background: var(--bg-tertiary); }
    .toc-link.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
    .toc-h3 { padding-left: 32px; font-size: 0.78rem; }

    /* ===== Main Content ===== */
    .main-content { max-width: var(--max-width); margin: 0 auto; padding: 32px 40px 60px; }

    /* ===== Section ===== */
    .section { padding: 40px 0 20px; border-bottom: 1px solid var(--border-light); }
    .section:last-child { border-bottom: none; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; margin-bottom: 16px;
      background: var(--bg-secondary); border: 1px solid var(--border-light);
      border-radius: 8px;
    }
    .section-header:hover { border-color: var(--accent); }
    .section-header h2 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 800; margin: 0; flex: 1; letter-spacing: -0.01em; }
    .section-badge {
      font-size: 0.72rem; font-weight: 600; padding: 2px 10px;
      border-radius: 10px; white-space: nowrap;
    }
    .badge-config { background: var(--accent-light); color: var(--accent); }
    .badge-runtime { background: var(--accent-green-light); color: var(--accent-green); }
    .badge-example { background: var(--accent-orange-light); color: var(--accent-orange); }
    .section-title {
      font-size: 1.7rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 12px;
    }
    .section-title .icon {
      width: 36px; height: 36px; border-radius: 10px; display: flex;
      align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
    }
    .section-desc { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 24px; max-width: 700px; }
    .section-body h3 { color: var(--accent); }
    h3 { font-family: var(--font-display); font-size: 1.12rem; font-weight: 700; margin: 28px 0 14px; }
    h3:first-child { margin-top: 0; }
    p { margin-bottom: 10px; }
    ul, ol { margin: 6px 0 12px 20px; }
    li { margin-bottom: 4px; font-size: 0.92rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ===== Collapsible Sections ===== */
    details.section-block { margin: 0 0 4px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    details.section-block > summary {
      padding: 16px 20px; cursor: pointer; font-weight: 600; background: var(--bg-secondary);
      display: flex; align-items: center; gap: 10px; list-style: none;
    }
    details.section-block > summary::-webkit-details-marker { display: none; }
    details.section-block > summary::before { content: '\25B6'; font-size: 0.7rem; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
    details.section-block[open] > summary::before { transform: rotate(90deg); }
    details.section-block > summary h2 { font-size: 1.3rem; font-weight: 700; margin: 0; display: inline; }
    .section-body { padding: 4px 20px 20px; }

    /* ===== Cards ===== */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .card-grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
    .card-grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px; transition: all 0.2s;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .card h4 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    .card p, .card li { font-size: 0.88rem; color: var(--text-secondary); }
    .card ul { margin: 6px 0 0 18px; }
    .card.accent-green { border-left: 3px solid var(--card-green); }
    .card.accent-amber { border-left: 3px solid var(--card-amber); }
    .card.accent-red { border-left: 3px solid var(--card-red); }
    .card.accent-violet { border-left: 3px solid var(--card-violet); }
    .card.accent-cyan { border-left: 3px solid var(--card-cyan); }
    .card.accent-blue { border-left: 3px solid var(--card-blue); }
    .tag {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      font-size: 0.75rem; font-weight: 600; margin-top: 10px;
    }

    /* ===== Table ===== */
    .table-wrapper { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); margin: 12px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { background: var(--bg-tertiary); padding: 12px 16px; text-align: left; font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-secondary); border-bottom: 1px solid var(--border); position: sticky; top: 0; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-secondary); }

    /* ===== Code ===== */
    code {
      font-family: var(--font-mono); background: var(--bg-tertiary);
      padding: 1px 6px; border-radius: 4px; font-size: 0.88em;
    }
    .code-block {
      position: relative; background: var(--bg-tertiary); border: 1px solid var(--border);
      border-radius: var(--radius); margin: 12px 0; overflow: hidden;
    }
    .code-block pre { padding: 16px 18px; overflow-x: auto; line-height: 1.6; margin: 0; }
    .code-block code { background: none; padding: 0; font-size: 0.85rem; font-family: var(--font-mono); }
    .code-block .lang-tag {
      position: absolute; top: 6px; right: 8px; font-size: 0.7rem; color: var(--text-muted);
      background: var(--bg-secondary); padding: 1px 8px; border-radius: 4px; opacity: 0; transition: opacity 0.15s;
    }
    .code-block:hover .lang-tag { opacity: 1; }
    .code-block .copy-btn {
      position: absolute; top: 6px; right: 60px; font-size: 0.72rem; color: var(--text-muted);
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 8px; cursor: pointer; opacity: 0; transition: opacity 0.15s;
    }
    .code-block:hover .copy-btn { opacity: 1; }
    .code-block .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    /* Manual syntax highlight spans (zero-dependency fallback) */
    .code-block .cmt { color: var(--text-muted); }
    .code-block .kw { color: var(--accent-purple); }
    .code-block .fn { color: var(--accent); }
    .code-block .str { color: var(--accent-green); }
    .code-block .num { color: var(--accent-orange); }

    /* ===== Diagram (ASCII art) ===== */
    .diagram {
      background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; font-family: var(--font-mono); font-size: 0.82rem;
      line-height: 1.5; overflow-x: auto; white-space: pre; margin: 16px 0; color: var(--text);
      position: relative;
    }
    .diagram-hint {
      position: absolute; bottom: 8px; right: 12px; font-size: 0.7rem; color: var(--text-muted);
      opacity: 0; transition: opacity 0.2s;
    }
    .diagram:hover .diagram-hint { opacity: 0.7; }

    /* ===== Callout ===== */
    .callout {
      padding: 14px 18px; border-radius: var(--radius); margin: 14px 0;
      font-size: 0.9rem; display: flex; gap: 10px; align-items: flex-start;
    }
    .callout-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }
    .callout.info { background: var(--info-bg); border-left: 3px solid var(--info-border); }
    .callout.warning { background: var(--warning-bg); border-left: 3px solid var(--warning-border); }
    .callout.success { background: var(--success-bg); border-left: 3px solid var(--success-border); }
    .callout.danger { background: var(--danger-bg); border-left: 3px solid var(--danger-border); }
    .callout.note { background: var(--note-bg); border-left: 3px solid var(--note-border); }

    /* ===== Flow ===== */
    .flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; }
    .flow-step {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px; text-align: center; flex: 1; min-width: 100px;
      position: relative;
    }
    .flow-step b { display: block; font-size: 0.82rem; color: var(--accent); margin-bottom: 2px; }
    .flow-step span { font-size: 0.78rem; color: var(--text-secondary); }
    .flow-arrow { color: var(--text-muted); font-size: 1rem; flex-shrink: 0; }

    /* ===== Tabs (pure CSS) ===== */
    .tabs { margin: 16px 0; }
    .tabs > input[type="radio"] { display: none; }
    .tab-bar { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 12px; }
    .tab-bar label {
      padding: 8px 18px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted);
      cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s;
    }
    .tab-bar label:hover { color: var(--text); }
    .tab-panel { display: none; }
    .tabs > input:nth-of-type(1):checked ~ .tab-bar label:nth-of-type(1),
    .tabs > input:nth-of-type(2):checked ~ .tab-bar label:nth-of-type(2),
    .tabs > input:nth-of-type(3):checked ~ .tab-bar label:nth-of-type(3),
    .tabs > input:nth-of-type(4):checked ~ .tab-bar label:nth-of-type(4),
    .tabs > input:nth-of-type(5):checked ~ .tab-bar label:nth-of-type(5) {
      color: var(--accent); border-bottom-color: var(--accent);
    }
    .tabs > input:nth-of-type(1):checked ~ .tab-panel:nth-of-type(1),
    .tabs > input:nth-of-type(2):checked ~ .tab-panel:nth-of-type(2),
    .tabs > input:nth-of-type(3):checked ~ .tab-panel:nth-of-type(3),
    .tabs > input:nth-of-type(4):checked ~ .tab-panel:nth-of-type(4),
    .tabs > input:nth-of-type(5):checked ~ .tab-panel:nth-of-type(5) {
      display: block;
    }

    /* ===== Layer Stack ===== */
    .layer-stack { display: flex; flex-direction: column; gap: 4px; margin: 16px 0; }
    .layer {
      padding: 14px 18px; border-radius: var(--radius); font-weight: 600; font-size: 0.9rem;
      display: flex; align-items: center; gap: 12px;
    }
    .layer .layer-label { font-size: 0.75rem; opacity: 0.7; font-weight: 400; }
    .layer.app { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); }
    .layer.core { background: var(--accent-purple-light); border: 1px solid var(--accent-purple); color: var(--accent-purple); }
    .layer.infra { background: var(--accent-orange-light); border: 1px solid var(--accent-orange); color: var(--accent-orange); }
    .layer.hw { background: var(--accent-green-light); border: 1px solid var(--accent-green); color: var(--accent-green); }

    /* ===== Step Indicators ===== */
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 16px 0; }
    .step {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 16px 16px 52px; position: relative;
    }
    .step::before {
      content: attr(data-step); position: absolute; left: 14px; top: 16px;
      width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff;
      font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .step h4 { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
    .step p { font-size: 0.82rem; color: var(--text-secondary); margin: 0; }

    /* ===== Prerequisite Box ===== */
    .prereq {
      background: var(--bg-secondary); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: var(--radius); padding: 16px 18px; margin: 14px 0;
    }
    .prereq h4 { font-size: 0.9rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    .prereq ul { margin: 0 0 0 18px; }
    .prereq li { font-size: 0.88rem; color: var(--text-secondary); }

    /* ===== Dependency Tree ===== */
    .dep-tree {
      background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; font-family: var(--font-mono); font-size: 0.85rem;
      line-height: 1.6; overflow-x: auto; white-space: pre; margin: 12px 0; color: var(--text);
    }

    /* ===== Details (FAQ) ===== */
    details.faq { margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    details.faq summary {
      padding: 12px 16px; cursor: pointer; font-weight: 600; background: var(--bg-secondary);
      display: flex; align-items: center; gap: 8px; list-style: none; font-size: 0.92rem;
    }
    details.faq summary::-webkit-details-marker { display: none; }
    details.faq summary::before { content: '\25B6'; font-size: 0.65rem; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; }
    details.faq[open] summary::before { transform: rotate(90deg); }
    details.faq > div { padding: 12px 16px; font-size: 0.88rem; color: var(--text-secondary); }

    /* ===== Feature List ===== */
    .feature-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
    .feature-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
      background: var(--bg-secondary); border-radius: var(--radius); font-size: 0.88rem;
    }
    .feature-item .check { color: var(--accent-green); font-weight: bold; flex-shrink: 0; margin-top: 2px; }

    /* ===== Anchor offset ===== */
    [id] { scroll-margin-top: calc(var(--header-height) + 16px); }

    /* ===== Responsive ===== */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; top: var(--header-height); left: 0; width: 280px;
        height: calc(100vh - var(--header-height)); z-index: 99; transform: translateX(-100%);
        transition: transform 0.25s ease; box-shadow: var(--shadow-md);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-toggle { display: flex; }
      .main-content { padding: 24px 20px 40px; }
      .hero h1 { font-size: 1.7rem; }
      .section-title { font-size: 1.3rem; }
      .card-grid, .card-grid.cols-2, .card-grid.cols-3 { grid-template-columns: 1fr; }
      .flow { flex-direction: column; }
      .flow-arrow { transform: rotate(90deg); }
      .steps { grid-template-columns: 1fr; }
    }

    /* ===== Scope Block ===== */
    .scope-block {
      background: var(--info-bg); border-left: 3px solid var(--info);
      padding: 12px 16px; border-radius: var(--radius); margin-bottom: 20px;
      font-size: 0.9rem;
    }

    /* ===== Print ===== */
    @media print {
      .topbar, .sidebar, .copy-btn, .lang-tag, .diagram-hint { display: none !important; }
      .layout { grid-template-columns: 1fr; }
      .main-content { max-width: 100%; padding: 0; }
      .section { page-break-inside: avoid; }
      details, details.section-block, details.faq { break-inside: avoid; }
      details[open] > summary + * { break-inside: avoid; }
      a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.8em; color: var(--text-muted); }
    }
  </style>
</head>

<!-- ===== Script ===== -->
<script>
(function() {
  'use strict';

  // --- Theme ---
  const root = document.documentElement;
  const saved = localStorage.getItem('doc-theme');
  if (saved) root.setAttribute('data-theme', saved);
  else if (window.matchMedia('(prefers-color-scheme: dark)').matches) root.setAttribute('data-theme', 'dark');

  window.toggleTheme = function() {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('doc-theme', next);
  };

  // --- Sidebar ---
  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('open');
  };

  // --- TOC auto-generation ---
  function slugify(text) {
    return text.trim().toLowerCase()
      .replace(/[\s]+/g, '-')
      .replace(/[^\w一-鿿-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-|-$/g, '');
  }

  function buildTOC() {
    const toc = document.getElementById('toc');
    if (!toc) return;
    const items = [];
    // Collect from both flat sections and collapsible sections
    document.querySelectorAll('.section[id] > .section-title, .section[id] > .section-header h2, details.section-block[id] > summary h2').forEach(el => {
      const section = el.closest('[id]');
      if (!section) return;
      const text = el.textContent.trim();
      items.push({ id: section.id, text: text, level: 2 });
    });
    // H3 headings inside sections
    document.querySelectorAll('.section[id] h3[id], .section-body h3[id], details.section-block[id] h3[id]').forEach(el => {
      items.push({ id: el.id, text: el.textContent.trim(), level: 3 });
    });
    // If no H3 have ids, auto-generate from text
    document.querySelectorAll('.section h3:not([id]), .section-body h3:not([id])').forEach(el => {
      const id = slugify(el.textContent);
      if (id && !document.getElementById(id)) {
        el.id = id;
        items.push({ id: id, text: el.textContent.trim(), level: 3 });
      }
    });

    let html = '';
    items.forEach(item => {
      const cls = item.level === 3 ? 'toc-link toc-h3' : 'toc-link';
      html += '<a class="' + cls + '" href="#' + item.id + '">' + item.text + '</a>';
    });
    toc.innerHTML = html;

    // Close sidebar on mobile after click
    toc.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        if (window.innerWidth <= 900) {
          document.getElementById('sidebar').classList.remove('open');
        }
      });
    });
  }

  // --- ScrollSpy ---
  function setupScrollSpy() {
    const links = document.querySelectorAll('.toc-link');
    if (!links.length) return;
    const targets = [];
    links.forEach(link => {
      const id = link.getAttribute('href').slice(1);
      const el = document.getElementById(id);
      if (el) targets.push({ el: el, link: link });
    });
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          links.forEach(l => l.classList.remove('active'));
          const match = targets.find(t => t.el === entry.target);
          if (match) match.link.classList.add('active');
        }
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    targets.forEach(t => observer.observe(t.el));
  }

  // --- Code highlighting + copy ---
  function setupCodeBlocks() {
    document.querySelectorAll('.code-block').forEach(block => {
      // Inject copy button
      if (!block.querySelector('.copy-btn')) {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.onclick = function() {
          const code = block.querySelector('code');
          navigator.clipboard.writeText(code.textContent).then(() => {
            btn.textContent = '✓';
            setTimeout(() => btn.textContent = 'Copy', 1500);
          });
        };
        block.appendChild(btn);
      }
      // Inject language tag
      const code = block.querySelector('code');
      if (code) {
        const lang = code.className.match(/language-(\w+)/);
        if (lang && !block.querySelector('.lang-tag')) {
          const tag = document.createElement('span');
          tag.className = 'lang-tag';
          tag.textContent = lang[1];
          block.appendChild(tag);
        }
      }
    });
    // highlight.js
    if (typeof hljs !== 'undefined') {
      document.querySelectorAll('.code-block pre code').forEach(el => {
        hljs.highlightElement(el);
      });
    }
  }

  // --- Init ---
  buildTOC();
  setupScrollSpy();
  setupCodeBlocks();

  // Also setup copy for diagrams (as text)
  document.querySelectorAll('.diagram').forEach(block => {
    if (!block.querySelector('.copy-btn')) {
      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.style.cssText = 'position:absolute;top:8px;right:8px;font-size:0.72rem;color:var(--text-muted);background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer;opacity:0;transition:opacity 0.15s;';
      block.style.position = 'relative';
      btn.textContent = 'Copy';
      btn.onmouseenter = () => btn.style.opacity = '1';
      btn.onmouseleave = () => btn.style.opacity = '0';
      block.onmouseenter = () => btn.style.opacity = '1';
      block.onmouseleave = () => btn.style.opacity = '0';
      btn.onclick = function() {
        navigator.clipboard.writeText(block.textContent.replace('Copy', '').replace(/✓/g, '').trim()).then(() => {
          btn.textContent = '✓';
          setTimeout(() => btn.textContent = 'Copy', 1500);
        });
      };
      block.appendChild(btn);
    }
  });
})();
